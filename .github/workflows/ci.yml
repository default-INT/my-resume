name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [v20.10.0]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: TypeScript Check
      run: npx tsc --noEmit

    - name: Build project
      run: npm run build
      env:
        NEXT_PUBLIC_SITE_URL: https://default-INT.github.io/my-resume
        NEXT_PUBLIC_PREFIX_URL: /my-resume

    - name: Upload build artifacts
      if: matrix.node-version == 'v20.10.0'
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: build/
        retention-days: 1 
